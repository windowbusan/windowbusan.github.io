<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>부산의 창</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <style>
        body { padding-top: 20px; font-family: sans-serif; }
        /* 로고 및 설명 영역 */
        .main-header { text-align: center; padding: 40px 0; }
        .main-logo { max-width: 400px; height: auto; }
        .site-desc { font-size: 1.1rem; color: #555; margin-top: 10px; margin-bottom: 20px; }
        
        /* 한 줄 메뉴 (중복 제거) */
        .menu-nav { display: flex; justify-content: center; gap: 30px; padding: 15px 0; border-top: 2px solid #222; border-bottom: 2px solid #222; }
        .menu-nav a { color: #333; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

<!-- 큰 로고 및 설명 영역 -->
<div class="main-header">
    <a href="{{ site.baseurl }}/">
        <img src="{{ site.baseurl }}/assets/images/logo.png" class="main-logo" alt="부산의 창">
    </a>
    <p class="site-desc">부산의 생생한 목소리를 전하는 지역미디어, 부산의 창입니다.</p>
</div>

<!-- 통합 메뉴 한 줄 -->
<nav class="menu-nav">
    <a href="{{ site.baseurl }}/">홈</a>
    <a href="#">오피니언</a>
    <a href="#">정치</a>
    <a href="#">경제</a>
    <a href="#">사회</a>
    <a href="#">문화</a>
    <a href="#">현장기사</a>
</nav>

<div class="container" style="margin-top: 30px;">
    {{ content }}
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>{{ site.name }}</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
<link href="{{ site.baseurl }}/assets/css/main.css" rel="stylesheet">
<style>
    /* 언론사 스타일 최적화 */
    body { padding-top: 100px; }
    .top-header { border-bottom: 2px solid #222; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .btn-donate { background-color: #87CEEB; color: #000; font-weight: 700; padding: 5px 15px; border: 1px solid #555; text-decoration: none; }
    .news-menu { border-bottom: 2px solid #0056b3; padding: 10px 0; margin-bottom: 20px; display: flex; gap: 20px; }
    .news-menu a { color: #333; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <a href="{{ site.baseurl }}/"><img src="{{ site.baseurl }}/assets/images/logo.png" alt="로고" style="height: 40px;"></a>
        <a href="#" class="btn-donate">후원하기</a>
    </div>

    <div class="news-menu">
        <a href="{{ site.baseurl }}/">홈</a>
        <a href="#">오피니언</a>
        <a href="#">정치</a>
        <a href="#">경제</a>
        <a href="#">사회</a>
        <a href="#">문화</a>
    </div>

    <div class="site-content">
        {{ content }}
    </div>

    <footer class="footer" style="margin-top: 50px; text-align: center; color: #777;">
        <p>Designed by Busan Window</p>
    </footer>
</div>

</body>
</html>
